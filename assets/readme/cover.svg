<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title description">
<title id="title">拾笺 InkJian</title>
<desc id="description">拾起日常，落墨成笺。本地 Markdown 写作与博客管理。</desc>
<rect x="1" y="1" width="1198" height="278" rx="26" fill="#F7F6F2" stroke="#E8E7E1"/>
<circle cx="1095" cy="64" r="100" fill="#87968B" opacity="0.08"/>
<circle cx="1135" cy="220" r="140" fill="#87968B" opacity="0.05"/>
<g transform="translate(65 59) scale(.29) translate(-310 -260)">
  <!-- 拾笺 InkJian · 极简博客头像（Q版圆润版）
       暖白底 #F7F6F2 / 石墨灰线 #292929 / 鼠尾草绿墨滴 #87968B
       大圆角页面 + 加粗圆头线条 + 圆胖墨滴，主体居中，适合圆形裁切 -->


  <g fill="none" stroke="#292929" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- 页面：大圆角，右上圆润折角 -->
    <path d="M 388 288
             L 566 288
             L 684 406
             L 684 664
             Q 684 712 636 712
             L 388 712
             Q 340 712 340 664
             L 340 336
             Q 340 288 388 288 Z"/>
    <!-- 翻页：下缘与外缘倒圆 -->
    <path d="M 566 288
             L 566 384
             Q 566 406 588 406
             L 684 406"/>
    <!-- 两道短胖墨迹 -->
    <path d="M 402 545 C 452 529, 542 529, 592 545"/>
    <path d="M 402 615 C 452 599, 522 599, 568 615"/>
  </g>

  <!-- 鼠尾草绿圆胖墨滴：自页面右下角渗出 -->
  <path fill="#87968B" d="M 690 672
    C 700 700, 762 712, 766 748
    C 769 780, 745 800, 714 798
    C 686 796, 666 774, 670 746
    C 673 722, 681 694, 690 672 Z"/>
  <!-- 圆润卫星点 -->
  <circle cx="768" cy="676" r="14" fill="#87968B"/>
</g>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
<text x="265" y="90" font-size="13" font-weight="600" letter-spacing="3" fill="#74867A">A SPACE FOR YOUR WORDS</text>
<text x="262" y="152" font-size="45" font-weight="650" fill="#292929">拾笺 <tspan font-weight="500">InkJian</tspan></text>
<text x="265" y="196" font-size="22" fill="#62665F">拾起日常，落墨成笺。</text>
<text x="265" y="236" font-size="14" fill="#7B7E76">本地写作 · 模板化博客 · GitHub Pages</text>
</g>
<path d="M 850 140 Q 930 110 1010 140 M 850 170 Q 900 150 950 170" fill="none" stroke="#87968B" stroke-width="6" stroke-linecap="round" opacity=".23"/>
</svg>
