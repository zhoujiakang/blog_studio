name: blog_studio
description: "InkJian 拾笺 — local Markdown writing and blog editing"
publish_to: none
version: 0.0.1+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  file_selector: ^1.1.0
  super_clipboard: ^0.9.1
  window_manager: ^0.5.2
  url_launcher: ^6.3.3
  path: ^1.9.1
  crypto: ^3.0.7
  yaml: ^3.1.4
  pub_semver: ^2.2.1
  webview_flutter: 4.14.1
  webview_flutter_wkwebview: 3.27.0
  flutter_svg: ^2.3.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - LICENSE
    - assets/brand/
    - assets/editor/
    - integrations/preview/layout.mjs
    - integrations/preview/probe.mjs
    - integrations/preview/server.mjs
    - integrations/preview/build.mjs
    - integrations/preview/install.mjs
    - integrations/preview/platform/
